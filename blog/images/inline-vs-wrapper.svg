<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" fill="none">
  <rect width="780" height="380" rx="12" fill="#0d1117"/>

  <!-- Left: Inline Pattern -->
  <text x="185" y="32" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f3f4f6" text-anchor="middle">Inline Pattern</text>

  <rect x="30" y="50" width="320" height="280" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="78" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#e2e8f0">your-project/</text>

  <rect x="50" y="94" width="130" height="34" rx="5" fill="#1a2332" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="115" y="116" font-family="'Fira Code', monospace" font-size="12" fill="#3b82f6" text-anchor="middle">.claude/</text>

  <rect x="190" y="94" width="140" height="34" rx="5" fill="#1a2332" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="260" y="116" font-family="'Fira Code', monospace" font-size="12" fill="#3b82f6" text-anchor="middle">CLAUDE.md</text>

  <rect x="50" y="138" width="100" height="34" rx="5" fill="#1a2332" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="100" y="160" font-family="'Fira Code', monospace" font-size="12" fill="#3b82f6" text-anchor="middle">DOCS/</text>

  <rect x="50" y="190" width="280" height="120" rx="6" fill="#0d1117" stroke="#1e293b" stroke-width="1.2"/>
  <text x="70" y="216" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">src/</text>
  <text x="70" y="240" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">package.json</text>
  <text x="70" y="264" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">index.html</text>
  <text x="70" y="288" font-family="'Fira Code', monospace" font-size="12" fill="#6b7280">...</text>

  <text x="185" y="355" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Single repo -- config lives with code</text>

  <!-- Divider -->
  <line x1="390" y1="16" x2="390" y2="365" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="375" y="182" width="30" height="24" rx="4" fill="#0d1117"/>
  <text x="390" y="199" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">vs</text>

  <!-- Right: Wrapper Pattern -->
  <text x="595" y="32" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f3f4f6" text-anchor="middle">Wrapper Pattern</text>

  <rect x="430" y="50" width="320" height="280" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="78" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#e2e8f0">claude-wrapper/</text>
  <text x="635" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3b82f6">(private)</text>

  <rect x="450" y="94" width="120" height="34" rx="5" fill="#1a2332" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="510" y="116" font-family="'Fira Code', monospace" font-size="12" fill="#3b82f6" text-anchor="middle">.claude/</text>

  <rect x="580" y="94" width="130" height="34" rx="5" fill="#1a2332" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="645" y="116" font-family="'Fira Code', monospace" font-size="12" fill="#3b82f6" text-anchor="middle">CLAUDE.md</text>

  <rect x="450" y="138" width="100" height="34" rx="5" fill="#1a2332" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="500" y="160" font-family="'Fira Code', monospace" font-size="12" fill="#3b82f6" text-anchor="middle">DOCS/</text>

  <rect x="450" y="190" width="280" height="120" rx="6" fill="#0d1117" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="470" y="216" font-family="'Fira Code', monospace" font-size="13" font-weight="500" fill="#9ca3af">your-project/</text>
  <text x="638" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">(git-ignored)</text>
  <text x="470" y="244" font-family="'Fira Code', monospace" font-size="12" fill="#6b7280">src/</text>
  <text x="470" y="268" font-family="'Fira Code', monospace" font-size="12" fill="#6b7280">package.json</text>
  <text x="470" y="292" font-family="'Fira Code', monospace" font-size="12" fill="#4b5563">...</text>

  <text x="595" y="355" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Config separate from code</text>
</svg>