<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" fill="none">
  <rect width="780" height="500" rx="12" fill="#0d1117"/>

  <!-- Outer: Companion repo -->
  <rect x="40" y="20" width="700" height="460" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="52" font-family="'Fira Code', monospace" font-size="15" font-weight="600" fill="#e2e8f0">my-project-claude/</text>
  <text x="340" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3b82f6">(your claude companion repo)</text>

  <!-- ===== Claude Configuration Section ===== -->

  <!-- Left bracket: Claude configuration -->
  <line x1="58" y1="72" x2="58" y2="238" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="58" y1="72" x2="66" y2="72" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="58" y1="238" x2="66" y2="238" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="52" y="162" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" transform="rotate(-90, 52, 162)">Claude configuration</text>

  <!-- .claude/ box -->
  <rect x="72" y="72" width="300" height="166" rx="7" fill="#1a2332" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="92" y="100" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#3b82f6">.claude/</text>

  <text x="108" y="126" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">agents/</text>
  <text x="220" y="126" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">domain specialists</text>

  <text x="108" y="150" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">skills/</text>
  <text x="220" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">knowledge + workflows</text>

  <text x="108" y="174" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">commands/</text>
  <text x="220" y="174" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">slash command shortcuts</text>

  <text x="108" y="198" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">rules/</text>
  <text x="220" y="198" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">auto-applied conventions</text>

  <text x="108" y="226" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af">settings.json</text>
  <text x="220" y="226" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">permissions + environment</text>

  <!-- CLAUDE.md box -->
  <rect x="392" y="72" width="150" height="48" rx="6" fill="#1a2332" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="416" y="102" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#3b82f6">CLAUDE.md</text>

  <!-- DOCS/ box -->
  <rect x="560" y="72" width="160" height="48" rx="6" fill="#1a2332" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="584" y="102" font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#3b82f6">DOCS/</text>

  <!-- Description for CLAUDE.md and DOCS/ -->
  <text x="392" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">Project context for Claude.</text>
  <text x="392" y="168" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">Architecture documentation.</text>
  <text x="392" y="188" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">Versioned independently from</text>
  <text x="392" y="208" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">the application code.</text>

  <!-- ===== Separator ===== -->
  <line x1="72" y1="256" x2="720" y2="256" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== Application Code Section ===== -->

  <!-- Left bracket: Application code -->
  <line x1="58" y1="272" x2="58" y2="462" stroke="#6b7280" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="58" y1="272" x2="66" y2="272" stroke="#6b7280" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="58" y1="462" x2="66" y2="462" stroke="#6b7280" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="52" y="374" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" transform="rotate(-90, 52, 374)">Application code (untouched)</text>

  <!-- App repo dashed box -->
  <rect x="72" y="272" width="648" height="192" rx="7" fill="#0d1117" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="92" y="300" font-family="'Fira Code', monospace" font-size="14" font-weight="500" fill="#9ca3af">my-project/</text>
  <text x="280" y="300" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">(cloned in, git-ignored — its own repo with its own history)</text>

  <!-- App directory items -->
  <rect x="92" y="316" width="100" height="32" rx="4" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="142" y="337" font-family="'Fira Code', monospace" font-size="11" fill="#6b7280" text-anchor="middle">src/</text>

  <rect x="204" y="316" width="140" height="32" rx="4" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="274" y="337" font-family="'Fira Code', monospace" font-size="11" fill="#6b7280" text-anchor="middle">package.json</text>

  <rect x="356" y="316" width="120" height="32" rx="4" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="416" y="337" font-family="'Fira Code', monospace" font-size="11" fill="#6b7280" text-anchor="middle">.github/</text>

  <rect x="488" y="316" width="120" height="32" rx="4" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="548" y="337" font-family="'Fira Code', monospace" font-size="11" fill="#6b7280" text-anchor="middle">index.html</text>

  <rect x="620" y="316" width="70" height="32" rx="4" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="655" y="337" font-family="'Fira Code', monospace" font-size="11" fill="#4b5563" text-anchor="middle">...</text>

  <!-- Bottom callout inside the dashed box -->
  <text x="92" y="380" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">No .claude/ here. No CLAUDE.md. No DOCS/.</text>
  <text x="92" y="400" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">The application repo stays exactly as it is — only application code.</text>

  <!-- Emphasis line at bottom -->
  <text x="92" y="440" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3b82f6">All Claude-related configuration is managed from the companion repo above.</text>
</svg>