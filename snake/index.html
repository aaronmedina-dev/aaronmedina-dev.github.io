<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Snake game - a classic arcade game built with HTML5 Canvas.">
    <meta name="author" content="Aaron Medina">
    <meta name="theme-color" content="#0a0f1a">
    <link rel="canonical" href="https://aaronmedina-dev.github.io/snake/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aaronmedina-dev.github.io/snake/">
    <meta property="og:title" content="Snake">
    <meta property="og:description" content="A classic Snake game with a twist.">
    <meta property="og:site_name" content="Aaron Medina">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #1f2937;
            --border-light: #374151;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            z-index: 30;
            pointer-events: none;
        }

        .hud > * {
            pointer-events: auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .score-bar {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            font-variant-numeric: tabular-nums;
        }

        .score-item svg {
            flex-shrink: 0;
        }

        .score-high {
            color: var(--text-primary);
        }

        .score-current {
            color: var(--accent);
        }

        .game-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 15, 26, 0.85);
            backdrop-filter: blur(6px);
            gap: 16px;
            z-index: 20;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .game-overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .overlay-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .overlay-score {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
        }

        .overlay-high {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .play-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
            margin-top: 8px;
        }

        .play-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .controls-hint {
            display: flex;
            gap: 16px;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            padding: 0 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Name input */
        .name-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .name-input-row label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .name-input {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 8px 12px;
            width: 160px;
            outline: none;
            transition: border-color 0.2s;
        }

        .name-input:focus {
            border-color: var(--accent);
        }

        /* Leaderboard */
        .leaderboard {
            width: 100%;
            max-width: 360px;
            margin-top: 8px;
        }

        .leaderboard-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-list li {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            gap: 12px;
        }

        .leaderboard-list li:nth-child(odd) {
            background: rgba(26, 34, 52, 0.5);
        }

        .leaderboard-list li.lb-self {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .lb-rank {
            width: 24px;
            text-align: center;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .lb-rank-1 { color: #fbbf24; }
        .lb-rank-2 { color: #d1d5db; }
        .lb-rank-3 { color: #d97706; }

        .lb-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-score {
            font-weight: 600;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .lb-empty {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
            padding: 16px;
        }

        /* Mobile touch controls */
        .touch-controls {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            gap: 4px;
        }

        .touch-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            background: rgba(26, 34, 52, 0.8);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
        }

        .touch-btn:active {
            background: rgba(55, 65, 81, 0.9);
        }

        .touch-spacer {
            width: 60px;
            height: 60px;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: grid;
            }
            .controls-hint {
                display: none;
            }
        }

        @media (max-width: 540px) {
            .touch-controls {
                display: grid;
            }
            .controls-hint {
                display: none;
            }
            .overlay-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="hud">
    <a href="/" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Home
    </a>
    <div class="score-bar">
        <div class="score-item score-high">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 7 7 7 7"/>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 17 7 17 7"/>
                <path d="M4 22h16"/>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
            </svg>
            <span id="highScoreHud">0</span>
        </div>
        <div class="score-item score-current">
            <span id="score">0</span>
        </div>
    </div>
</div>

<div class="game-overlay" id="startOverlay">
    <div class="overlay-title">Snake</div>
    <div class="overlay-subtitle">Eat the food, avoid yourself</div>
    <div class="name-input-row">
        <label for="playerName">Name</label>
        <input type="text" id="playerName" class="name-input" maxlength="20" placeholder="Enter a name" autocomplete="off" spellcheck="false">
    </div>
    <button class="play-btn" id="startBtn">Play</button>
    <div class="controls-hint">
        <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> or arrows to move</span>
        <span><span class="key">P</span> pause</span>
    </div>
    <div class="leaderboard" id="leaderboardStart">
        <div class="leaderboard-title">Leaderboard</div>
        <div class="lb-empty">Loading...</div>
    </div>
</div>

<div class="game-overlay hidden" id="gameOverOverlay">
    <div class="overlay-title" id="gameOverTitle">Game Over</div>
    <div class="overlay-subtitle" id="gameOverSubtitle"></div>
    <div class="overlay-score" id="finalScore"></div>
    <div class="overlay-high" id="highScoreEnd"></div>
    <button class="play-btn" id="restartBtn">Play Again</button>
    <div class="leaderboard" id="leaderboardEnd">
        <div class="leaderboard-title">Leaderboard</div>
        <div class="lb-empty">Loading...</div>
    </div>
</div>

<div class="touch-controls" id="touchControls">
    <div class="touch-row">
        <div class="touch-spacer"></div>
        <button class="touch-btn" data-dir="up">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
        <div class="touch-spacer"></div>
    </div>
    <div class="touch-row">
        <button class="touch-btn" data-dir="left">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="touch-btn" data-dir="down">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="touch-btn" data-dir="right">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getDatabase, ref, set, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// ── Random name generator ──
var adjectives = [
    'Swift', 'Sneaky', 'Cosmic', 'Neon', 'Pixel', 'Turbo', 'Hyper',
    'Shadow', 'Cyber', 'Blazing', 'Mystic', 'Atomic', 'Silent', 'Frosty',
    'Golden', 'Lucky', 'Stealth', 'Rogue', 'Phantom', 'Glitch'
];
var nouns = [
    'Cobra', 'Viper', 'Mamba', 'Python', 'Serpent', 'Dragon', 'Fox',
    'Wolf', 'Hawk', 'Tiger', 'Panda', 'Phoenix', 'Falcon', 'Lynx',
    'Otter', 'Raven', 'Mantis', 'Kraken', 'Gecko', 'Badger'
];

function randomName() {
    var a = adjectives[Math.floor(Math.random() * adjectives.length)];
    var n = nouns[Math.floor(Math.random() * nouns.length)];
    return a + n;
}

// ── Name persistence ──
var nameInput = document.getElementById('playerName');
try {
    var saved = localStorage.getItem('snake-player-name');
    nameInput.value = saved || randomName();
} catch (e) {
    nameInput.value = randomName();
}
nameInput.addEventListener('input', function () {
    try { localStorage.setItem('snake-player-name', nameInput.value); } catch (e) {}
});

function getPlayerName() {
    var n = nameInput.value.trim();
    return n.length > 0 ? n.substring(0, 20) : randomName();
}

// ── Firebase (graceful degradation) ──
var firebaseReady = false;
var auth, db, currentUid = null;

try {
    var firebaseApp = initializeApp({
        apiKey: "AIzaSyALxLYG29BAiZMbmWu1uX2zmUBtNfxmZdw",
        authDomain: "aaronmedina-snake.firebaseapp.com",
        databaseURL: "https://aaronmedina-snake-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "aaronmedina-snake",
        storageBucket: "aaronmedina-snake.firebasestorage.app",
        messagingSenderId: "1069221054394",
        appId: "1:1069221054394:web:46221e9cb1c2bc8621ff83"
    });

    auth = getAuth(firebaseApp);
    db = getDatabase(firebaseApp);
    firebaseReady = true;

    signInAnonymously(auth).catch(function () {});
    onAuthStateChanged(auth, function (user) {
        if (user) {
            currentUid = user.uid;
            loadLeaderboard();
        }
    });
} catch (e) {}

// ── Leaderboard ──
function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function renderLeaderboard(entries, container) {
    var inner = '<div class="leaderboard-title">Leaderboard</div>';
    if (!entries || entries.length === 0) {
        inner += '<div class="lb-empty">No scores yet. Be the first!</div>';
    } else {
        inner += '<ul class="leaderboard-list">';
        entries.forEach(function (e, i) {
            var rankClass = i < 3 ? ' lb-rank-' + (i + 1) : '';
            var selfClass = e.uid === currentUid ? ' lb-self' : '';
            inner += '<li class="' + selfClass + '">'
                + '<span class="lb-rank' + rankClass + '">' + (i + 1) + '</span>'
                + '<span class="lb-name">' + escapeHtml(e.name) + '</span>'
                + '<span class="lb-score">' + e.score + '</span>'
                + '</li>';
        });
        inner += '</ul>';
    }
    container.innerHTML = inner;
}

function showLeaderboardError() {
    var msg = '<div class="leaderboard-title">Leaderboard</div><div class="lb-empty">Could not load leaderboard</div>';
    document.getElementById('leaderboardStart').innerHTML = msg;
    document.getElementById('leaderboardEnd').innerHTML = msg;
}

function loadLeaderboard() {
    if (!firebaseReady || !db) { showLeaderboardError(); return; }
    try {
        var q = query(ref(db, 'leaderboard'), orderByChild('score'), limitToLast(10));
        get(q).then(function (snapshot) {
            var entries = [];
            snapshot.forEach(function (child) {
                var v = child.val();
                if (v && v.name && typeof v.score === 'number') {
                    entries.push({ uid: child.key, name: v.name, score: v.score });
                }
            });
            entries.sort(function (a, b) { return b.score - a.score; });
            renderLeaderboard(entries, document.getElementById('leaderboardStart'));
            renderLeaderboard(entries, document.getElementById('leaderboardEnd'));
        }).catch(function () {
            showLeaderboardError();
        });
    } catch (e) {
        showLeaderboardError();
    }
}

function submitScore(scoreVal) {
    if (!firebaseReady || !currentUid || !db || scoreVal <= 0) return;
    try {
        var userRef = ref(db, 'leaderboard/' + currentUid);
        get(userRef).then(function (snapshot) {
            var existing = snapshot.val();
            if (!existing || scoreVal > existing.score) {
                return set(userRef, {
                    name: getPlayerName(),
                    score: scoreVal,
                    timestamp: Date.now()
                });
            }
        }).then(function () {
            loadLeaderboard();
        }).catch(function () {});
    } catch (e) {}
}

// Load leaderboard on start
loadLeaderboard();

// ── Game ──
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');

var GRID = 20;
var COLS, ROWS;
var BASE_SPEED = 120;
var SPEED_BOOST = 8;
var MIN_SPEED = 50;

var snake, direction, nextDirection, food, score, speed, gameLoop, paused, running;

// Sound effects via Web Audio API
var audioCtx = null;

function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playEat() {
    ensureAudio();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(520, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + 0.08);
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime + 0.12);
}

function playDie() {
    ensureAudio();
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.4);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.start(t);
    o.stop(t + 0.4);
}

function playHighScore() {
    ensureAudio();
    var t = audioCtx.currentTime;
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (freq, i) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, t + i * 0.12);
        g.gain.setValueAtTime(0, t + i * 0.12);
        g.gain.linearRampToValueAtTime(0.18, t + i * 0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.2);
        o.start(t + i * 0.12);
        o.stop(t + i * 0.12 + 0.2);
    });
}

var scoreEl = document.getElementById('score');
var highScoreHudEl = document.getElementById('highScoreHud');
var startOverlay = document.getElementById('startOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var finalScoreEl = document.getElementById('finalScore');
var highScoreEndEl = document.getElementById('highScoreEnd');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    COLS = Math.floor(canvas.width / GRID);
    ROWS = Math.floor(canvas.height / GRID);
    if (running && !paused) draw();
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function getHighScore() {
    try { return parseInt(localStorage.getItem('snake-high-score')) || 0; } catch (e) { return 0; }
}

function setHighScore(val) {
    try { localStorage.setItem('snake-high-score', val); } catch (e) {}
}

function updateHighScoreDisplay() {
    var hs = getHighScore();
    highScoreHudEl.textContent = hs;
    highScoreEndEl.textContent = hs > 0 ? 'Your best: ' + hs : '';
}

function init() {
    snake = [
        { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
        { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
        { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = BASE_SPEED;
    paused = false;
    running = true;
    scoreEl.textContent = '0';
    placeFood();
}

function placeFood() {
    var attempts = 0;
    do {
        food = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
        };
        attempts++;
    } while (isOnSnake(food.x, food.y) && attempts < 1000);
}

function isOnSnake(x, y) {
    for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
}

function update() {
    if (paused || !running) return;

    direction = nextDirection;

    var head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Wrap around walls
    if (head.x < 0) head.x = COLS - 1;
    else if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    else if (head.y >= ROWS) head.y = 0;

    // Self collision
    if (isOnSnake(head.x, head.y)) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        playEat();

        // Speed up every 5 food
        if (score % 5 === 0) {
            speed = Math.max(MIN_SPEED, speed - SPEED_BOOST);
            clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        placeFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw grid dots (matches site background)
    var dotRadius = 1.5;
    for (var i = 0; i < COLS; i++) {
        for (var j = 0; j < ROWS; j++) {
            ctx.beginPath();
            ctx.arc(i * GRID + GRID / 2, j * GRID + GRID / 2, dotRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.15)';
            ctx.fill();
        }
    }

    // Draw food with glow
    ctx.shadowColor = '#3b82f6';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.arc(
        food.x * GRID + GRID / 2,
        food.y * GRID + GRID / 2,
        GRID / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw snake
    for (var i = 0; i < snake.length; i++) {
        var seg = snake[i];
        var t = i / snake.length;
        var r = Math.round(59 + t * (156 - 59));
        var g = Math.round(130 + t * (163 - 130));
        var b = Math.round(246 + t * (175 - 246));
        var alpha = 1 - t * 0.3;

        ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';

        var pad = i === 0 ? 1 : 2;
        var radius = i === 0 ? 5 : 3;

        roundRect(
            ctx,
            seg.x * GRID + pad,
            seg.y * GRID + pad,
            GRID - pad * 2,
            GRID - pad * 2,
            radius
        );
        ctx.fill();
    }

    // Draw eyes on head
    var head = snake[0];
    ctx.fillStyle = '#0a0f1a';
    var eyeSize = 3;
    var eyeOffset = 5;
    var cx = head.x * GRID + GRID / 2;
    var cy = head.y * GRID + GRID / 2;

    if (direction.x === 1) {
        ctx.beginPath(); ctx.arc(cx + eyeOffset, cy - 4, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + eyeOffset, cy + 4, eyeSize, 0, Math.PI * 2); ctx.fill();
    } else if (direction.x === -1) {
        ctx.beginPath(); ctx.arc(cx - eyeOffset, cy - 4, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx - eyeOffset, cy + 4, eyeSize, 0, Math.PI * 2); ctx.fill();
    } else if (direction.y === -1) {
        ctx.beginPath(); ctx.arc(cx - 4, cy - eyeOffset, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 4, cy - eyeOffset, eyeSize, 0, Math.PI * 2); ctx.fill();
    } else {
        ctx.beginPath(); ctx.arc(cx - 4, cy + eyeOffset, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 4, cy + eyeOffset, eyeSize, 0, Math.PI * 2); ctx.fill();
    }
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

var gameOverTitleEl = document.getElementById('gameOverTitle');
var gameOverSubtitleEl = document.getElementById('gameOverSubtitle');

function gameOver() {
    running = false;
    clearInterval(gameLoop);
    var hs = getHighScore();
    var name = getPlayerName();
    if (score > hs) {
        setHighScore(score);
        gameOverTitleEl.textContent = 'Congratulations, ' + name + '!';
        gameOverSubtitleEl.textContent = '';
        finalScoreEl.textContent = 'New high score: ' + score;
        playHighScore();
    } else {
        gameOverTitleEl.textContent = 'Game Over';
        gameOverSubtitleEl.textContent = '';
        finalScoreEl.textContent = 'Score: ' + score;
        playDie();
    }
    updateHighScoreDisplay();
    submitScore(score);
    loadLeaderboard();
    gameOverOverlay.classList.remove('hidden');
}

function startGame() {
    ensureAudio();
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    init();
    draw();
    gameLoop = setInterval(update, speed);
}

// Keyboard controls
document.addEventListener('keydown', function (e) {
    if (!running && e.key !== 'Enter') return;

    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            e.preventDefault();
            break;
        case 'ArrowDown': case 's': case 'S':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            e.preventDefault();
            break;
        case 'ArrowLeft': case 'a': case 'A':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            e.preventDefault();
            break;
        case 'ArrowRight': case 'd': case 'D':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            e.preventDefault();
            break;
        case 'p': case 'P':
            if (running) paused = !paused;
            break;
        case 'Enter':
            if (!running) startGame();
            break;
    }
});

// Touch controls
document.querySelectorAll('.touch-btn').forEach(function (btn) {
    btn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        var dir = this.getAttribute('data-dir');
        if (dir === 'up' && direction.y !== 1) nextDirection = { x: 0, y: -1 };
        if (dir === 'down' && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        if (dir === 'left' && direction.x !== 1) nextDirection = { x: -1, y: 0 };
        if (dir === 'right' && direction.x !== -1) nextDirection = { x: 1, y: 0 };
    });
});

// Swipe controls
var touchStartX = 0;
var touchStartY = 0;

canvas.addEventListener('touchstart', function (e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    var absDx = Math.abs(dx);
    var absDy = Math.abs(dy);

    if (Math.max(absDx, absDy) < 30) return;

    if (absDx > absDy) {
        if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
    } else {
        if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
    }
}, { passive: true });

// Button handlers
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// Initial state
updateHighScoreDisplay();
</script>
